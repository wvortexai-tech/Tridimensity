<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tridimensity — Sistema</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0a; --surface:#161616; --surface-2:#1f1f1f; --surface-3:#262626;
    --red:#e2141c; --red-dim:#4a0d10;
    --white:#f5f5f5; --muted:#8a8a8a; --danger:#ff5c5c; --ok:#3ecf6e;
    --font:'Montserrat',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--white);font-family:var(--font);font-weight:400;padding-bottom:80px;}
  h1,h2,h3{font-family:var(--font);}
  input,select,button{font-family:var(--font);}

  header{
    position:sticky;top:0;z-index:20;background:rgba(10,10,10,0.94);backdrop-filter:blur(10px);
    border-bottom:1px solid rgba(245,245,245,0.08);padding:18px 4%;
    display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;
  }
  .brand{display:flex;align-items:center;gap:12px;}
  .brand img{height:38px;width:auto;}
  .brand-text{font-weight:800;font-size:1.15rem;letter-spacing:-0.01em;}
  .brand-text small{display:block;font-weight:600;font-size:0.62rem;color:var(--muted);letter-spacing:0.1em;text-transform:uppercase;}

  nav{display:flex;gap:8px;flex-wrap:wrap;}
  .nav-btn{
    background:transparent;border:1px solid rgba(245,245,245,0.15);color:var(--muted);
    padding:9px 18px;border-radius:100px;font-weight:600;font-size:0.85rem;cursor:pointer;transition:all 0.15s ease;
  }
  .nav-btn:hover{color:var(--white);border-color:rgba(245,245,245,0.35);}
  .nav-btn.active{background:var(--red);border-color:var(--red);color:var(--white);}

  main{max-width:1180px;margin:0 auto;padding:32px 4% 0;}
  .view{display:none;}
  .view.active{display:block;}

  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:28px;}
  .card{background:var(--surface);border:1px solid rgba(245,245,245,0.08);border-radius:14px;padding:18px;}
  .card .label{font-size:0.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;font-weight:600;margin-bottom:8px;}
  .card .val{font-size:1.5rem;font-weight:800;}
  .card.accent .val{color:var(--red);}
  .card.ok .val{color:var(--ok);}

  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;}
  .chip{
    background:var(--surface);border:1px solid rgba(245,245,245,0.12);color:var(--muted);
    padding:7px 16px;border-radius:100px;font-size:0.8rem;font-weight:600;cursor:pointer;transition:all 0.15s ease;
  }
  .chip.active{background:var(--white);color:var(--bg);border-color:var(--white);}

  .panel{background:var(--surface);border:1px solid rgba(245,245,245,0.08);border-radius:14px;padding:22px;margin-bottom:24px;}
  .panel h3{font-size:0.95rem;font-weight:700;margin-bottom:16px;color:var(--red);}
  .form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;align-items:end;}
  .field label{display:block;font-size:0.72rem;color:var(--muted);margin-bottom:6px;font-weight:600;}
  .field input, .field select{
    width:100%;background:var(--surface-2);border:1px solid rgba(245,245,245,0.14);border-radius:8px;
    padding:10px 12px;color:var(--white);font-size:0.88rem;
  }
  .field input:focus, .field select:focus{outline:none;border-color:var(--red);}
  .field .hint{font-size:0.66rem;color:var(--muted);margin-top:4px;opacity:0.8;}
  .hint{font-size:0.78rem;color:var(--muted);}
  .btn-link-item{background:transparent;border:none;color:var(--white);font-family:var(--font);font-size:0.85rem;font-weight:600;cursor:pointer;text-decoration:underline;text-decoration-color:rgba(245,245,245,0.3);padding:0;}
  .btn-link-item:hover{color:var(--red);}
  .detail-row td{padding:0 10px 16px;background:rgba(226,20,28,0.03);}
  .detail-box{background:var(--surface-2);border:1px solid rgba(245,245,245,0.1);border-radius:10px;padding:16px;}
  .detail-box table{border:none;background:transparent;}
  .checkbox-field{display:flex;align-items:center;gap:8px;padding-bottom:10px;}
  .checkbox-field input{width:18px;height:18px;accent-color:var(--red);}
  .checkbox-field label{font-size:0.82rem;color:var(--white);margin:0;}

  .btn{border:none;cursor:pointer;padding:11px 22px;border-radius:100px;font-weight:700;font-size:0.85rem;transition:transform 0.15s ease;}
  .btn:hover{transform:translateY(-1px);}
  .btn-primary{background:var(--red);color:var(--white);}
  .btn-danger{background:transparent;color:var(--danger);font-size:0.75rem;padding:5px 10px;font-weight:600;}
  .btn-ghost-cancel{background:transparent;border:1px solid rgba(245,245,245,0.2);color:var(--muted);}
  .edit-form{padding:10px 4px;}
  .btn-block{margin-top:14px;}

  table{width:100%;border-collapse:collapse;background:var(--surface);border-radius:14px;overflow:hidden;border:1px solid rgba(245,245,245,0.08);}
  thead th{font-size:0.68rem;text-transform:uppercase;letter-spacing:0.05em;color:var(--muted);text-align:left;padding:12px 10px;border-bottom:1px solid rgba(245,245,245,0.08);font-weight:700;}
  tbody td{padding:12px 10px;font-size:0.85rem;border-bottom:1px solid rgba(245,245,245,0.05);}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:rgba(245,245,245,0.02);}
  .badge{display:inline-block;padding:3px 10px;border-radius:100px;font-size:0.68rem;font-weight:700;background:var(--surface-3);color:var(--muted);}
  .badge.pago{background:rgba(62,207,110,0.15);color:var(--ok);}
  .badge.pendente{background:rgba(226,20,28,0.15);color:var(--red);}
  .toggle{cursor:pointer;}
  .table-wrap{overflow-x:auto;}
  .section-gap{margin-top:40px;}
  .empty-state{text-align:center;padding:40px 20px;color:var(--muted);font-size:0.85rem;background:var(--surface);border-radius:14px;border:1px dashed rgba(245,245,245,0.15);}
  .loading{text-align:center;padding:60px;color:var(--muted);}
  .status{position:fixed;bottom:20px;right:20px;background:var(--surface-2);border:1px solid rgba(62,207,110,0.3);color:var(--ok);font-size:0.78rem;font-weight:600;padding:8px 16px;border-radius:100px;opacity:0;transition:opacity 0.3s ease;pointer-events:none;z-index:30;}
  .status.show{opacity:1;}
  .shared-note{font-size:0.72rem;color:var(--muted);margin-bottom:20px;padding:10px 14px;background:var(--surface);border-left:2px solid var(--red);border-radius:6px;}
  .margin-input{width:56px;background:var(--surface-2);border:1px solid rgba(245,245,245,0.15);border-radius:6px;color:var(--white);padding:4px 6px;font-family:var(--font);}
  .login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .login-card{background:var(--surface);border:1px solid rgba(245,245,245,0.1);border-radius:16px;padding:40px 32px;width:100%;max-width:360px;text-align:center;}
  .login-card img{height:52px;margin-bottom:20px;}
  .login-card h2{font-weight:800;margin-bottom:6px;}
  .login-card p{color:var(--muted);font-size:0.82rem;margin-bottom:28px;}
  .login-card .field{text-align:left;margin-bottom:14px;}
  .login-error{color:var(--danger);font-size:0.8rem;margin-top:10px;min-height:1em;}
  .logout-btn{background:transparent;border:1px solid rgba(245,245,245,0.15);color:var(--muted);padding:8px 16px;border-radius:100px;font-size:0.78rem;font-weight:600;cursor:pointer;}
  .logout-btn:hover{color:var(--white);border-color:rgba(245,245,245,0.35);}
</style>
</head>

function flashStatus(msg, isError){
  const el = document.getElementById('status');
  el.textContent = msg;
  el.style.borderColor = isError ? 'rgba(255,92,92,0.4)' : 'rgba(62,207,110,0.3)';
  el.style.color = isError ? 'var(--danger)' : 'var(--ok)';
  el.classList.add('show');
  clearTimeout(window._t);
  window._t = setTimeout(()=>el.classList.remove('show'), 1400);
}

// ---------- LOAD / SYNC ----------
async function loadPedidos(){
  const {data, error} = await sb.from('pedidos').select('*').order('id');
  if(error){ console.error(error); flashStatus('Erro ao carregar pedidos', true); return; }
  state.pedidos = data.map(p => ({id:p.id, categoria:p.categoria, cliente:p.cliente, descricao:p.descricao, formato:p.formato, cor:p.cor, valor:Number(p.valor), pago:p.pago, producaoId:p.producao_id, quantidadeLote:p.quantidade_lote, data:p.data, lote:p.lote, produzido:p.produzido}));
}
async function loadProducao(){
  const {data, error} = await sb.from('producao').select('*').order('data', {ascending:true, nullsFirst:false}).order('id');
  if(error){ console.error(error); flashStatus('Erro ao carregar produção', true); return; }
  state.producao = data.map(p => ({id:p.id, cliente:p.cliente, item:p.item, quantidade:Number(p.quantidade), data:p.data, finalizado:p.finalizado}));
}
async function loadCaixa(){
  const [inj, desp] = await Promise.all([
    sb.from('injecoes').select('*').order('id'),
    sb.from('despesas').select('*').order('id')
  ]);
  if(inj.error) console.error(inj.error);
  if(desp.error) console.error(desp.error);
  state.injecoes = (inj.data||[]).map(i => ({id:i.id, item:i.item, valor:Number(i.valor), data:i.data}));
  state.despesas = (desp.data||[]).map(d => ({id:d.id, item:d.item, valor:Number(d.valor), data:d.data, tipo:d.tipo}));
}
async function loadPrecos(){
  const [prem, prod] = await Promise.all([
    sb.from('premissas').select('*').eq('id',1).maybeSingle(),
    sb.from('produtos_preco').select('*').order('id')
  ]);
  if(prem.data){
    state.premissas = {tarifa:Number(prem.data.tarifa), potencia:Number(prem.data.potencia), filamentoKg:Number(prem.data.filamento_kg), horaTrabalho:Number(prem.data.hora_trabalho)};
  }
  state.produtosPreco = (prod.data||[]).map(p => ({id:p.id, nome:p.nome, peso:Number(p.peso), tempoImpressao:Number(p.tempo_impressao), tempoTrabalho:Number(p.tempo_trabalho), embalagem:Number(p.embalagem), margem:Number(p.margem)}));
}

async function loadNotas(){
  const {data, error} = await sb.from('notas').select('*').order('updated_at', {ascending:false});
  if(error){ console.error(error); flashStatus('Erro ao carregar notas', true); return; }
  state.notas = data.map(n => ({id:n.id, conteudo:n.conteudo, updatedAt:n.updated_at}));
}

async function loadAll(){
  try{
    await Promise.all([loadPedidos(), loadProducao(), loadCaixa(), loadPrecos(), loadNotas()]);
  }catch(e){
    console.error('Erro ao carregar', e);
    flashStatus('Erro ao conectar ao banco', true);
  }
  state.loaded = true;
  render();
}

async function boot(){

  else { renderLogin(); }
}

// ---------- NOTAS ----------
function abrirNota(id){ state.notaEditing = id; render(); }
function novaNota(){ state.notaEditing = 'new'; render(); }
function fecharNota(){ state.notaEditing = null; render(); }
async function salvarNota(conteudo, id){
  if(!conteudo.trim()){
    if(id && id !== 'new'){ await sb.from('notas').delete().eq('id', id); }
    state.notaEditing = null;
    await loadNotas();
    render();
    return;
  }
  if(id === 'new'){
    const {data, error} = await sb.from('notas').insert([{conteudo}]).select().single();
    if(error){ console.error(error); flashStatus('Erro ao salvar', true); return; }
    state.notaEditing = data.id;
  } else {
    const {error} = await sb.from('notas').update({conteudo, updated_at: new Date().toISOString()}).eq('id', id);
    if(error){ console.error(error); flashStatus('Erro ao salvar', true); return; }
  }
  await loadNotas();
  flashStatus('Salvo');
  render();
}
async function removerNota(id){
  const {error} = await sb.from('notas').delete().eq('id', id);
  if(error){ console.error(error); flashStatus('Erro ao remover', true); return; }
  state.notaEditing = null;
  await loadNotas();
  flashStatus('Removido');
  render();
}
async function enviarParaProducao(form){
  const ids = Array.from(state.selecionados);
  if(ids.length === 0) return;
  const data = form.dataProducao.value;
  if(!data){ flashStatus('Escolha uma data de produção', true); return; }
  const quantidade = parseFloat(form.quantidade.value) || ids.length;
  const selecionadosPedidos = state.pedidos.filter(p => ids.includes(p.id));
  const clientesUnicos = [...new Set(selecionadosPedidos.map(p=>p.cliente))];
  const itensUnicos = [...new Set(selecionadosPedidos.map(p=>p.descricao || p.categoria))];
  const cliente = clientesUnicos.length === 1 ? clientesUnicos[0] : `${clientesUnicos.length} clientes`;
  const item = itensUnicos.length === 1 ? itensUnicos[0] : `${ids.length} pedidos diversos`;

  const {data: novaOrdem, error} = await sb.from('producao').insert([{
    cliente, item, quantidade, data, finalizado: false
  }]).select().single();
  if(error){ console.error(error); flashStatus('Erro ao criar ordem', true); return; }

  const {error: linkError} = await sb.from('pedidos').update({producao_id: novaOrdem.id}).in('id', ids);
  if(linkError){ console.error(linkError); flashStatus('Erro ao vincular pedidos', true); return; }

  state.selecionados.clear();
  await Promise.all([loadPedidos(), loadProducao()]);
  flashStatus('Enviado pra produção');
  render();
}

// ---------- PEDIDOS ----------
async function addPedido(form){
  const cliente = form.cliente.value.trim();
  if(!cliente) return;
  const categoria = form.categoria.value;
  const quantidade = Math.max(1, parseInt(form.quantidade.value) || 1);
  const base = {
    categoria, cliente,
    descricao: form.descricao.value.trim(),
    formato: categoria === 'Chaveiro Personalizado' ? form.formato.value.trim() : null,
    cor: form.cor.value.trim(),
    valor: parseFloat(form.valor.value) || 0,
    pago: form.pago.checked,
    data: form.data.value || new Date().toISOString().slice(0,10)
  };
  const rows = Array.from({length: quantidade}, () => ({...base}));
  const {data: inserted, error} = await sb.from('pedidos').insert(rows).select('id');
  if(error){ console.error(error); flashStatus('Erro ao salvar', true); return; }
  if(inserted && inserted.length > 1){
    const loteId = Math.min(...inserted.map(r=>r.id));
    const ids = inserted.map(r=>r.id);
    await sb.from('pedidos').update({lote: loteId}).in('id', ids);
  }
  form.reset();
  document.getElementById('data-pedido-input').value = new Date().toISOString().slice(0,10);
  await loadPedidos();
  flashStatus('Salvo');
  render();
}
async function duplicatePedido(id){

  const {error} = await sb.from('pedidos').insert([rest]);

// ---------- PRECIFICAÇÃO ----------
function calcPreco(p){
  const material = (p.peso/1000) * state.premissas.filamentoKg;
  const energia = p.tempoImpressao * state.premissas.potencia * state.premissas.tarifa;
  const maoObra = p.tempoTrabalho * state.premissas.horaTrabalho;
  const custoTotal = material + energia + maoObra + p.embalagem;
  const preco = custoTotal * (1 + p.margem/100);
  const lucro = preco - custoTotal;
  return {material, energia, maoObra, custoTotal, preco, lucro};
}
async function updatePremissa(key, val){

// ---------- RENDER ----------
function render(){
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active', b.dataset.view===state.view));
  const app = document.getElementById('app');
  if(!app) return;
  if(!state.loaded){ app.innerHTML = '<div class="loading">Carregando…</div>'; return; }
  if(state.view==='pedidos') renderPedidos(app);
  else if(state.view==='producao') renderProducao(app);
  else if(state.view==='precos') renderPrecos(app);
  else if(state.view==='notas') renderNotas(app);
  else renderCaixa(app);
}

function renderPedidos(app){
  let filtered = state.filtro==='Todos' ? state.pedidos.slice() : state.pedidos.filter(p=>p.categoria===state.filtro);
  if(state.statusFiltro==='Pago') filtered = filtered.filter(p=>p.pago);
  else if(state.statusFiltro==='Pendente') filtered = filtered.filter(p=>!p.pago);
  else if(state.statusFiltro==='Não enviados') filtered = filtered.filter(p=>!p.producaoId);
  else if(state.statusFiltro==='Em produção') filtered = filtered.filter(p=>!!p.producaoId);
  else if(state.statusFiltro==='Produzido') filtered = filtered.filter(p=>p.produzido);
  else if(state.statusFiltro==='Não produzido') filtered = filtered.filter(p=>!p.produzido);

  if(state.ordenacao==='alfabetica') filtered.sort((a,b)=> (a.cliente||'').localeCompare(b.cliente||''));
  else if(state.ordenacao==='valor-desc') filtered.sort((a,b)=> b.valor-a.valor);
  else if(state.ordenacao==='valor-asc') filtered.sort((a,b)=> a.valor-b.valor);
  else if(state.ordenacao==='data-desc') filtered.sort((a,b)=> (b.data||'').localeCompare(a.data||''));
  else if(state.ordenacao==='data-asc') filtered.sort((a,b)=> (a.data||'').localeCompare(b.data||''));
  else filtered.reverse(); // recentes primeiro (id desc)

  const faturado = filtered.reduce((s,p)=>s+p.valor,0);
  const recebido = filtered.filter(p=>p.pago).reduce((s,p)=>s+p.valor,0);

  let chips = ['Todos', ...CATEGORIAS].map(c=>

  ).join('');

function renderCaixa(app){

function renderNotas(app){
  if(state.notaEditing !== null){
    const isNew = state.notaEditing === 'new';

    if(!nota){ state.notaEditing = null; return renderNotas(app); }
    app.innerHTML = `
      <div class="panel">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
          <button class="btn btn-ghost-cancel" id="voltar-notas">← Voltar</button>

          <button class="btn btn-primary" id="salvar-nota">Salvar</button>
        </div>
      </div>
    `;
    document.getElementById('voltar-notas').addEventListener('click', ()=>{
      const texto = document.getElementById('nota-texto').value;
      salvarNota(texto, state.notaEditing);
    });
    document.getElementById('salvar-nota').addEventListener('click', ()=>{
      const texto = document.getElementById('nota-texto').value;
      salvarNota(texto, state.notaEditing);
    });
    if(!isNew){
      document.getElementById('excluir-nota').addEventListener('click', ()=> removerNota(nota.id));
    }
    return;
  }

  const cards = state.notas.map(n=>{
    const linhas = (n.conteudo||'').split('\n');
    const titulo = linhas[0] || 'Nota sem título';
    const resto = linhas.slice(1).join(' ').trim();
    const dataFmt = n.updatedAt ? new Date(n.updatedAt).toLocaleDateString('pt-BR') : '';
    return `<div class="panel" style="cursor:pointer;margin-bottom:14px;" data-abrir-nota="${n.id}">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;">
        <h3 style="color:var(--white);margin:0;">${titulo}</h3>
        <span class="hint">${dataFmt}</span>
      </div>
      ${resto ? `<div style="color:var(--muted);font-size:0.85rem;">${resto.slice(0,140)}${resto.length>140?'…':''}</div>` : ''}
    </div>`;
  }).join('');

  app.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
      <div class="hint">Anotações livres da equipe — ideias, lembretes, o que quiser.</div>
      <button class="btn btn-primary" id="nova-nota-btn">+ Nova nota</button>
    </div>
    ${state.notas.length ? cards : '<div class="empty-state">Nenhuma nota ainda. Toque em "+ Nova nota" pra começar.</div>'}
  `;
  document.getElementById('nova-nota-btn').addEventListener('click', novaNota);
  app.querySelectorAll('[data-abrir-nota]').forEach(el=>{
    el.addEventListener('click', ()=> abrirNota(Number(el.dataset.abrirNota)));
  });
}

            <div class="field"><label>Impressão (h)</label><input name="tempoImpressao" type="number" step="0.05" value="${p.tempoImpressao}"></div>
            <div class="field"><label>Mão de obra (h)</label><input name="tempoTrabalho" type="number" step="0.05" value="${p.tempoTrabalho}"></div>
            <div class="field"><label>Embalagem (R$)</label><input name="embalagem" type="number" step="0.1" value="${p.embalagem}"></div>
            <div class="field"><label>Margem (%)</label><input name="margem" type="number" step="1" value="${p.margem}"></div>
          </div>
          <div style="display:flex;gap:10px;margin-top:14px;">
            <button type="submit" class="btn btn-primary">Salvar</button>
            <button type="button" class="btn btn-ghost-cancel" data-cancel="precos">Cancelar</button>
          </div>
        </form>
      </td></tr>`;
    }
    const c = calcPreco(p);
    return `<tr>
      <td>${p.nome}</td>
      <td>${p.peso}g</td>
      <td>${fmt(c.material)}</td>
      <td>${fmt(c.energia)}</td>
      <td>${fmt(c.maoObra)}</td>
      <td>${fmt(p.embalagem)}</td>
      <td>${fmt(c.custoTotal)}</td>
      <td><input type="number" step="1" value="${p.margem}" class="margin-input" data-margem="${p.id}">%</td>
      <td style="color:var(--red);font-weight:700;">${fmt(c.preco)}</td>
      <td style="color:var(--ok);">${fmt(c.lucro)}</td>
      <td style="white-space:nowrap;">
        <button class="btn btn-danger" data-edit-prod="${p.id}" style="color:var(--white);">editar</button>
        <button class="btn btn-danger" data-rmprod="${p.id}">remover</button>
      </td>
    </tr>`;
  }).join('');

  app.innerHTML = `
    <div class="panel">
      <h3>Premissas</h3>
      <div class="form-grid">${premGrid}</div>
    </div>
    <div class="panel">
      <h3>Novo produto</h3>
      <form id="produto-preco-form">
        <div class="form-grid">
          <div class="field"><label>Produto</label><input name="nome" placeholder="Ex: Chaveiro personalizado"></div>
          <div class="field"><label>Peso (g)</label><input name="peso" type="number" step="0.1" placeholder="13"></div>
          <div class="field"><label>Impressão (h)</label><input name="tempoImpressao" type="number" step="0.05" placeholder="0.6"></div>
          <div class="field"><label>Mão de obra (h)</label><input name="tempoTrabalho" type="number" step="0.05" placeholder="0.1"></div>
          <div class="field"><label>Embalagem (R$)</label><input name="embalagem" type="number" step="0.1" placeholder="1.50"></div>
          <div class="field"><label>Margem (%)</label><input name="margem" type="number" step="1" value="40"></div>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Adicionar produto</button>
      </form>
    </div>
    <div class="table-wrap">
      ${state.produtosPreco.length ? `<table><thead><tr>
        <th>Produto</th><th>Peso</th><th>Material</th><th>Energia</th><th>M. de obra</th><th>Embalagem</th><th>Custo total</th><th>Margem</th><th>Preço sugerido</th><th>Lucro</th><th></th>
      </tr></thead><tbody>${rows}</tbody></table>` : '<div class="empty-state">Nenhum produto precificado ainda.</div>'}
    </div>
  `;
  app.querySelectorAll('[data-prem]').forEach(inp=>{
    inp.addEventListener('change', ()=> updatePremissa(inp.dataset.prem, inp.value));
  });
  document.getElementById('produto-preco-form').addEventListener('submit', e=>{ e.preventDefault(); addProdutoPreco(e.target); });
  app.querySelectorAll('[data-margem]').forEach(inp=>{
    inp.addEventListener('change', ()=> updateProdutoMargem(Number(inp.dataset.margem), inp.value));
  });
  app.querySelectorAll('[data-rmprod]').forEach(el=> el.addEventListener('click', ()=> removeProdutoPreco(Number(el.dataset.rmprod))));
  app.querySelectorAll('[data-edit-prod]').forEach(el=> el.addEventListener('click', ()=> startEdit('precos', Number(el.dataset.editProd))));
  app.querySelectorAll('[data-cancel="precos"]').forEach(el=> el.addEventListener('click', ()=> cancelEdit('precos')));
  app.querySelectorAll('[data-edit-produto]').forEach(f=> f.addEventListener('submit', e=>{ e.preventDefault(); saveEditProdutoPreco(Number(f.dataset.editProduto), e.target); }));
}

boot();
</script>
</body>
</html>
